# Genre and centrality quotas for the retained corpus. Frozen scientific spec.
# Final counts must match EXACTLY. Token targets are optimization targets, not
# per-document hard lengths. Weighted genre token target = 20,496,000 (verified).
# G01-G05 (journalism/general-news) final counts sum to 5280 = 55% of 9600.

meta:
  final_total: 9600
  candidate_total: 15000
  weighted_token_target: 20496000        # sum(final_count * target_mean_tokens)
  journalism_genre_ids: [G01, G02, G03, G04, G05]
  journalism_final_total: 5280           # 55% of 9600
  candidate_multiplier: 1.5625

